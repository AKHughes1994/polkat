input_ms:
  data_column: DATA
  sigma_column:
  weight_column:
  time_chunk: '250'
  freq_chunk: '256'
  is_bda: false
  group_by:
  - SCAN_NUMBER
  - FIELD_ID
  - DATA_DESC_ID
  select_corr:
  select_fields: [0]
  select_ddids: []
  select_uv_range:
  - 0.0
  - 0.0
input_model:
  recipe: MODEL_DATA~DIR1_DATA:DIR1_DATA
  beam:
  beam_l_axis: X
  beam_m_axis: Y
  invert_uvw: true
  source_chunks: 500
  apply_p_jones: true
output:
  gain_directory: gains.qc
  log_directory: logs.qc
  log_to_terminal: true
  overwrite: true
  products: [corrected_residual]
  columns: [CORRECTED_DATA]
  flags: true
  apply_p_jones_inv: true
  subtract_directions: [1]
  net_gains:
  compute_baseline_corrections: false
  apply_baseline_corrections: false
mad_flags:
  enable: false
  whitening: disabled
  threshold_bl: 5.0
  threshold_global: 5.0
  max_deviation: 5.0
solver:
  terms:
  - G
  - dE
  iter_recipe:
  - 50
  - 50
  propagate_flags: true
  robust: false
  threads: 1  # Controls solver specific threads. See docs.
  convergence_fraction: 0.99
  convergence_criteria: 1e-06
  reference_antenna: 0
dask:
  threads: 8  # Controls dask threads i.e. number of chunks processed simultaneously. See docs.
  workers: 1
  address:
  scheduler: threads
G:
  type: diag_complex
  solve_per: antenna
  direction_dependent: false
  time_interval: '18'
  freq_interval: '256'
  load_from:
  interp_mode: reim
  interp_method: 2dlinear
  respect_scan_boundaries: true
  initial_estimate: false
dE:
  type: diag_complex
  solve_per: antenna
  direction_dependent: true
  pinned_directions:
  - 0
  time_interval: '72'
  freq_interval: '64'
  load_from:
  interp_mode: reim
  interp_method: 2dlinear
  respect_scan_boundaries: true
  initial_estimate: false
